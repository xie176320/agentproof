name: Publish AgentProof v0.1.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.1.0.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 0456fd9266eb01fb62ed76be285c5b6c45c78c83
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify release source
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Publish release and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.1.0
          RELEASE_TARGET: 0456fd9266eb01fb62ed76be285c5b6c45c78c83
        run: |
          gh release create "$RELEASE_TAG" dist/*             --target "$RELEASE_TARGET"             --title "AgentProof v0.1.0 — First public release"             --notes-file docs/release-notes-v0.1.0.md             --latest
