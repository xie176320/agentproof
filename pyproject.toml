[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof-scanner"
version = "0.1.0"
description = "Static security and engineering quality scanner for AI Agent, MCP, and Skills repositories"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "xie176320"}]
keywords = ["ai-agent", "mcp", "agent-skills", "security", "static-analysis", "devsecops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
web = ["streamlit>=1.36,<2"]
dev = ["build>=1.2", "ruff>=0.8", "pytest>=8", "pytest-cov>=6"]

[project.urls]
Homepage = "https://github.com/xie176320/agentproof"
Documentation = "https://github.com/xie176320/agentproof/tree/main/docs"
Issues = "https://github.com/xie176320/agentproof/issues"
Changelog = "https://github.com/xie176320/agentproof/blob/main/CHANGELOG.md"
Demo = "https://agentproof.streamlit.app/"
Security = "https://github.com/xie176320/agentproof/security/policy"
Source = "https://github.com/xie176320/agentproof"

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "RUF"]
ignore = ["E501", "S101"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["agentproof"]

[tool.coverage.report]
fail_under = 75
show_missing = true
