name: AgentProof scan
description: Static security and engineering quality checks for AI Agent, MCP, and Skills repositories
author: xie176320
branding:
  icon: shield
  color: green
inputs:
  path:
    description: Local repository path to scan
    required: false
    default: .
  fail-on:
    description: Minimum severity that fails the job
    required: false
    default: high
  format:
    description: table, json, markdown, html, or sarif
    required: false
    default: sarif
  output:
    description: Report output path
    required: false
    default: agentproof.sarif
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Install AgentProof
      shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - name: Scan repository
      shell: bash
      env:
        AGENTPROOF_INPUT_PATH: ${{ inputs.path }}
        AGENTPROOF_FAIL_ON: ${{ inputs.fail-on }}
        AGENTPROOF_FORMAT: ${{ inputs.format }}
        AGENTPROOF_OUTPUT: ${{ inputs.output }}
      run: >-
        agentproof scan "$AGENTPROOF_INPUT_PATH"
        --fail-on "$AGENTPROOF_FAIL_ON"
        --format "$AGENTPROOF_FORMAT"
        --output "$AGENTPROOF_OUTPUT"
        --no-color
